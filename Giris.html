<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Selection</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }
        h1 {
            margin-bottom: 20px;
        }
        .profile-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .profile {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .profile:hover {
            opacity: 0.8;
        }
        .red { background-color: red; }
        .blue { background-color: blue; }
        .green { background-color: green; }
        .yellow { background-color: rgb(238, 0, 255); }
    </style>
</head>
<body>npm create vite@latest my-movie-app --template react
    cd my-movie-app
    npm install
    npm run dev
    
    <h1>Kaç Kişi İzliyor?</h1>
    <div class="profile-container">
        <div class="profile red">User 1</div>
        <div class="profile blue">User 2</div>
        <div class="profile green">User 3</div>
        <div class="profile yellow">User 4</div>
    </div>
</body>
</html>
